services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_screening
    ports:
      # Use 5433 on the Mac to avoid conflicting with a locally installed PostgreSQL.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      # Use 11435 on the Mac to avoid conflicting with a native Ollama installation.
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull models after container starts:
    # docker compose exec ollama ollama pull llama3.1
    # docker compose exec ollama ollama pull nomic-embed-text

volumes:
  postgres_data:
  ollama_data:
