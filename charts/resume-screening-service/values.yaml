image:
  # Kept up to date automatically by .github/workflows/ci.yml's "Update Helm
  # chart image tag" step after every successful build - this is what lets
  # ArgoCD notice a new image exists, since it only watches git.
  repository: ghcr.io/lakshyatecno/resume-screening-service
  tag: "ee798d87408e7cef20fef5384bf4981c977cf0c3"
  pullPolicy: IfNotPresent

api:
  replicaCount: 2
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicaCount: 2
  metricsPort: 9100
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

service:
  type: ClusterIP
  port: 80

autoscaling:
  # Two alternative worker-scaling strategies - enable at most ONE. Both
  # create a HorizontalPodAutoscaler targeting the same worker Deployment;
  # Kubernetes rejects a Deployment having two HPAs at once.
  #
  # CPU-based (below): a rough proxy - the worker can sit CPU-idle while
  # blocked on network calls to Ollama/Pinecone/S3, so this can fail to
  # scale up exactly when the queue is backing up.
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

  # KEDA (queue-depth-based, the actually-correct signal): scales on real
  # SQS backlog via KEDA's aws-sqs-queue scaler. Requires the KEDA operator
  # already installed on the cluster - see docs/keda-autoscaling-explained.md.
  # Written and validated (helm lint/template) but never applied against a
  # live KEDA install, since proving it needs real AWS credentials this
  # environment doesn't have - same treatment as infra/terraform/.
  keda:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    queueLength: 5

# Non-secret settings -> ConfigMap. Keys match app/config.py's pydantic-settings
# field names (upper-cased), same convention as .env.example.
config:
  appName: "Resume Screening Service"
  debug: "false"
  # In-cluster service DNS + default ports - NOT the local-Mac shifted ports
  # (5433/11435) used in docker-compose for host-conflict avoidance.
  databaseUrl: "postgresql://postgres:postgres@postgres:5432/resume_screening"
  ollamaBaseUrl: "http://ollama:11434"
  ollamaLlmModel: "llama3.1"
  ollamaEmbedModel: "nomic-embed-text"
  ollamaNumCtx: "2048"
  ollamaNumPredict: "512"
  pineconeIndexName: "resume-screening-nomic-768"
  pineconeCloud: "aws"
  pineconeRegion: "us-east-1"
  vectorTopK: "20"
  rankingTopN: "5"
  awsRegion: "us-east-1"
  sqsQueueUrl: ""
  s3BucketName: ""
  dynamodbTableName: "resume-processing-status"
  workerMetricsPort: "9100"

# Secret values - pass with `--set secrets.xxx=...` or, better, via an
# external-secrets operator pointed at a real secret store. Never commit
# real values into this file.
secrets:
  pineconeApiKey: ""
  # Prefer IAM roles for service accounts (IRSA) over static keys on a real
  # EKS cluster; these exist for environments without IRSA available.
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
