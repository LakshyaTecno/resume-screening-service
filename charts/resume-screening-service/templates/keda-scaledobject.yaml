{{- if .Values.autoscaling.keda.enabled }}
# Requires the KEDA operator already installed on the cluster (this
# resource's CRD, ScaledObject, is KEDA's, not core Kubernetes). KEDA
# creates and manages the underlying HorizontalPodAutoscaler itself - don't
# also enable .Values.autoscaling.enabled at the same time, see the comment
# in values.yaml.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "resume-screening-service.fullname" . }}-worker
  labels:
    {{- include "resume-screening-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "resume-screening-service.fullname" . }}-worker
  minReplicaCount: {{ .Values.autoscaling.keda.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.keda.maxReplicas }}
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ .Values.config.sqsQueueUrl | quote }}
        queueLength: {{ .Values.autoscaling.keda.queueLength | quote }}
        awsRegion: {{ .Values.config.awsRegion | quote }}
        # Relies on the KEDA operator's own IAM identity (e.g. IRSA on a
        # real EKS cluster) rather than static credentials - same
        # preference already noted for the worker itself in values.yaml's
        # secrets block.
        identityOwner: operator
{{- end }}
