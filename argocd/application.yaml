# ArgoCD watches this repo's charts/resume-screening-service directory and
# syncs the cluster to match it - CI (.github/workflows/ci.yml) only builds
# and pushes the image; it never touches the cluster. That split is the
# actual point of GitOps: the cluster's state always traces back to a commit
# in this repo, not to a CI job's `kubectl apply`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resume-screening-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: CHANGE_ME # e.g. https://github.com/<org>/resume-screening-service.git
    targetRevision: main
    path: charts/resume-screening-service
    helm:
      valueFiles:
        - values.yaml
      # No image.tag override here on purpose: CI writes the real current
      # tag directly into values.yaml after every build (see
      # .github/workflows/ci.yml), so values.yaml itself is always correct.
      # An override here would fight that and pin the deployment to a
      # stale/wrong tag regardless of what CI just built.

  destination:
    server: https://kubernetes.default.svc
    namespace: resume-screening

  syncPolicy:
    automated:
      prune: true # remove resources deleted from the chart
      selfHeal: true # revert manual cluster drift back to what's in git
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
