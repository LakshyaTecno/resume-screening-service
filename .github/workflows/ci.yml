name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (black)
        run: black --check .

      - name: Lint (isort)
        run: isort --check-only .

      - name: Test
        run: |
          # Exit code 5 = "no tests collected", which is expected until a
          # tests/ directory exists - anything else is a real failure.
          pytest || [ $? -eq 5 ]

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          # Docker image names must be all-lowercase; github.repository
          # preserves the account's actual casing (e.g. LakshyaTecno/...),
          # which docker/build-push-action rejects outright.
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.repo }}:latest

    # This job stops at "image pushed". Deploying it is ArgoCD's job, not
    # CI's - it watches charts/resume-screening-service in this repo and
    # pulls, rather than CI pushing to a cluster. See argocd/application.yaml.
