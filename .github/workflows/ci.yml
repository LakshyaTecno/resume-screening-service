name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_screening_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (black)
        run: black --check .

      - name: Lint (isort)
        run: isort --check-only .

      - name: Verify migrations apply to a fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_screening_test
        run: alembic upgrade head

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_screening_test
        run: pytest

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          # Docker image names must be all-lowercase; github.repository
          # preserves the account's actual casing (e.g. LakshyaTecno/...),
          # which docker/build-push-action rejects outright.
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.repo }}:latest

    # This job stops at "image pushed". Deploying it is the `deploy` job's
    # work, on the self-hosted runner - see below.

  deploy:
    needs: build-and-push
    # No `if:` needed here - build-and-push already only runs on push-to-main
    # (never pull_request), and a job only runs if everything in `needs`
    # actually ran. Worth stating explicitly anyway: never add a
    # pull_request-triggered job that targets `self-hosted` in this repo -
    # this is a public repo, and a self-hosted runner reachable from a fork's
    # PR is a real way for a stranger to run code on this machine.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy via docker compose
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
