name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_screening_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (black)
        run: black --check .

      - name: Lint (isort)
        run: isort --check-only .

      - name: Verify migrations apply to a fresh database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_screening_test
        run: alembic upgrade head

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_screening_test
        run: pytest

  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          # Docker image names must be all-lowercase; github.repository
          # preserves the account's actual casing (e.g. LakshyaTecno/...),
          # which docker/build-push-action rejects outright.
          echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.repo }}:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.repo }}:latest

      - name: Update Helm chart image tag
        run: |
          # This is the CI -> CD bridge: ArgoCD only watches git, never the
          # registry, so pushing a new image under a floating tag alone
          # gives it nothing to react to. Writing the real tag back into
          # values.yaml is what actually closes the loop.
          sed -i "s|repository: .*|repository: ghcr.io/${{ steps.image.outputs.repo }}|" charts/resume-screening-service/values.yaml
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|" charts/resume-screening-service/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/resume-screening-service/values.yaml
          # [skip ci] is load-bearing: without it, this commit would trigger
          # another run of this exact workflow, forever.
          git diff --staged --quiet || git commit -m "chore: bump image tag to ${{ github.sha }} [skip ci]"
          git push

    # This job stops at "image pushed, chart updated". Deploying it is
    # ArgoCD's job, not CI's - it watches charts/resume-screening-service
    # in this repo and pulls, rather than CI pushing to a cluster. See
    # argocd/application.yaml.
